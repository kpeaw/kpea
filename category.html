<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KPEA — Nominees</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="hero">
  <span class="tagline">2060 Is Here</span>
  <h1 id="cat-title">Nominees</h1>
</header>

<div class="container">
  <a href="index.html" class="back-link">&larr; All categories</a>
  <div id="nominees" class="nominees-grid">
    <p style="color:var(--text-dim)">Loading nominees…</p>
  </div>
</div>

<div id="vote-modal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h3 id="modal-nominee-name">Vote</h3>
    <label>Number of votes</label>
    <input type="number" id="vote-count" min="1" value="1" oninput="updateTotal()" />
    <label>M-Pesa phone number (07XXXXXXXX)</label>
    <input type="tel" id="phone" placeholder="0712345678" />
    <p class="total">Total: KSh <span id="total-amount">20</span></p>
    <button class="btn gold" id="submit-vote-btn" onclick="submitVote()">Send STK Push</button>
    <button class="btn" style="background:#333" onclick="closeModal()">Cancel</button>
    <p id="status-msg" class="status-msg"></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/category.js"></script>
</body>
</html>
